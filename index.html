<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vault Tracker with Export</title>
  <style>
    :root {
      --bg: #0d0e12;
      --card: #161820;
      --border: #232733;
      --accent: #3b82f6;
      --vault: #10b981;
      --warn: #ef4444;
      --text: #f1f5f9;
      --muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 1.5rem; max-width: 480px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; }
    .badge { background: var(--card); border: 1px solid var(--border); padding: 0.25rem 0.6rem; border-radius: 20px; font-size: 0.75rem; color: var(--muted); }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    .card.full { grid-column: span 2; }
    .card.vault-card { border-color: rgba(16, 185, 129, 0.3); background: linear-gradient(180deg, #161820 0%, rgba(16, 185, 129, 0.05) 100%); }

    .label { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.05em; margin-bottom: 0.25rem; }
    .amount { font-size: 1.5rem; font-weight: 700; }
    .vault-amount { color: var(--vault); }
    .allowance-amount { color: var(--accent); }

    /* Timer Status Badge */
    .lock-status { 
      font-size: 0.75rem; 
      font-weight: 600; 
      padding: 0.25rem 0.5rem; 
      border-radius: 6px; 
      display: inline-block; 
      margin-top: 0.5rem; 
    }
    .lock-status.locked { background: rgba(239, 68, 68, 0.15); color: var(--warn); border: 1px solid rgba(239, 68, 68, 0.3); }
    .lock-status.unlocked { background: rgba(16, 185, 129, 0.15); color: var(--vault); border: 1px solid rgba(16, 185, 129, 0.3); }

    /* Progress Bar */
    .progress-container { margin-top: 1rem; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); margin-bottom: 0.35rem; font-weight: 500; }
    .progress-bar-bg { width: 100%; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--border); }
    .progress-bar-fill { height: 100%; background: linear-gradient(90deg, #10b981 0%, #3b82f6 100%); width: 0%; transition: width 0.4s ease; }

    .btn { width: 100%; background: var(--accent); color: white; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); margin-top: 0.5rem; }

    .btn-group { display: flex; gap: 0.5rem; margin-top: 1.5rem; }

    form { display: flex; flex-direction: column; gap: 0.75rem; margin-top: 1rem; }
    input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.75rem; border-radius: 8px; font-size: 0.9rem; outline: none; }
    input:focus { border-color: var(--accent); }

    .history-list { margin-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
    .history-item { display: flex; justify-content: space-between; background: var(--card); border: 1px solid var(--border); padding: 0.75rem; border-radius: 8px; font-size: 0.85rem; }
    .history-item span.spent { color: var(--warn); font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>Vault & Budget Tracker</h1>
    <span class="badge">Local Session</span>
  </header>

  <!-- Summary Cards -->
  <div class="grid">
    <div class="card full vault-card">
      <div style="display: flex; justify-content: space-between; align-items: flex-start;">
        <div>
          <div class="label">30-Day Vault Stash</div>
          <div class="amount vault-amount" id="vaultDisplay">GH₵ 0.00</div>
        </div>
        <div id="timerDisplay" class="lock-status unlocked">🔓 Open</div>
      </div>

      <div class="progress-container">
        <div class="progress-labels">
          <span id="progressText">0% to GH₵ 77 Goal</span>
          <span>Target: GH₵ 77.00</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="label">Today's Allowance</div>
      <div class="amount allowance-amount" id="dailyDisplay">GH₵ 16.40</div>
    </div>
    <div class="card">
      <div class="label">Weekly Balance</div>
      <div class="amount" id="weeklyDisplay">GH₵ 115.00</div>
    </div>
  </div>

  <!-- Action: Weekly Reset -->
  <button class="btn" onclick="startNewWeek()">⚡ Allocate New GH₵ 150 Transfer</button>
  
  <!-- Form: Log Expense -->
  <div class="card" style="margin-top: 1.5rem;">
    <div class="label">Log Daily Expense</div>
    <form id="expenseForm">
      <input type="number" id="expenseAmount" placeholder="Amount (GH₵)" step="0.50" required>
      <input type="text" id="expenseNote" placeholder="Note (e.g., Food, Snack, Airtime)" required>
      <button type="submit" class="btn btn-outline">Deduct Expense</button>
    </form>
  </div>

  <!-- Recent Log -->
  <div style="margin-top: 1.5rem;">
    <div class="label">Today's Activity</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Export & Reset Actions -->
  <div class="btn-group">
    <button class="btn btn-outline" style="border-color: var(--accent); color: var(--accent);" onclick="exportHistory()">📥 Export Logs (.txt)</button>
    <button class="btn btn-outline" style="border-color: var(--warn); color: var(--warn);" onclick="clearAllData()">Reset Data</button>
  </div>

  <script>
    const TARGET_SAVINGS = 77.00;

    let state = JSON.parse(localStorage.getItem('vaultState')) || {
      vault: 0.00,
      weekly: 115.00,
      daily: 16.40,
      vaultUnlockTime: null,
      history: []
    };

    function saveState() {
      localStorage.setItem('vaultState', JSON.stringify(state));
      render();
    }

    function render() {
      document.getElementById('vaultDisplay').textContent = `GH₵ ${state.vault.toFixed(2)}`;
      document.getElementById('weeklyDisplay').textContent = `GH₵ ${state.weekly.toFixed(2)}`;
      document.getElementById('dailyDisplay').textContent = `GH₵ ${state.daily.toFixed(2)}`;

      const percentage = Math.min(100, (state.vault / TARGET_SAVINGS) * 100);
      document.getElementById('progressFill').style.width = `${percentage}%`;
      document.getElementById('progressText').textContent = `${percentage.toFixed(0)}% of GH₵ 77 Goal`;

      const historyList = document.getElementById('historyList');
      historyList.innerHTML = state.history.length === 0 
        ? '<div style="color: var(--muted); font-size: 0.85rem;">No expenses logged today.</div>'
        : state.history.map(item => `
            <div class="history-item">
              <span>${item.note}</span>
              <span class="spent">- GH₵ ${item.amount.toFixed(2)}</span>
            </div>
          `).join('');

      updateTimer();
    }

    function updateTimer() {
      const timerDisplay = document.getElementById('timerDisplay');
      
      if (!state.vaultUnlockTime) {
        timerDisplay.className = "lock-status unlocked";
        timerDisplay.textContent = "🔓 Open";
        return;
      }

      const diff = state.vaultUnlockTime - Date.now();

      if (diff <= 0) {
        timerDisplay.className = "lock-status unlocked";
        timerDisplay.textContent = "🔓 Unlocked";
      } else {
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        timerDisplay.className = "lock-status locked";
        timerDisplay.textContent = `🔒 ${days}d ${hours}h ${minutes}m ${seconds}s`;
      }
    }

    function startNewWeek() {
      if (confirm("Process new GH₵ 150 transfer?\n\n• GH₵ 35.00 Data Cap deducted\n• GH₵ 16.80 locked to Vault for 7 days\n• GH₵ 98.20 added to Weekly Allowance")) {
        state.vault += 16.80;
        state.weekly = 98.20;
        state.daily = 16.40;
        state.vaultUnlockTime = Date.now() + (7 * 24 * 60 * 60 * 1000);
        state.history = [];
        saveState();
      }
    }

    document.getElementById('expenseForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('expenseAmount').value);
      const note = document.getElementById('expenseNote').value;

      if (amount > 0) {
        state.daily -= amount;
        state.weekly -= amount;
        state.history.unshift({ note, amount, date: new Date().toLocaleTimeString() });
        
        document.getElementById('expenseAmount').value = '';
        document.getElementById('expenseNote').value = '';
        saveState();
      }
    });

    // Export History Function
    function exportHistory() {
      if (state.history.length === 0 && state.vault === 0) {
        alert("No activity recorded yet to export.");
        return;
      }

      let content = `=======================================\n`;
      content += `   VAULT & BUDGET TRACKER SUMMARY      \n`;
      content += `=======================================\n`;
      content += `Export Date: ${new Date().toLocaleDateString()} ${new Date().toLocaleTimeString()}\n\n`;
      content += `Current Vault Stash: GH₵ ${state.vault.toFixed(2)} / 77.00 Goal\n`;
      content += `Remaining Weekly Balance: GH₵ ${state.weekly.toFixed(2)}\n`;
      content += `Remaining Daily Allowance: GH₵ ${state.daily.toFixed(2)}\n\n`;
      content += `---------------------------------------\n`;
      content += `RECENT SPENDING LOGS:\n`;
      content += `---------------------------------------\n`;

      if (state.history.length === 0) {
        content += `No expenses logged for this session.\n`;
      } else {
        state.history.forEach((item, index) => {
          content += `${index + 1}. [${item.date}] - GH₵ ${item.amount.toFixed(2)} (${item.note})\n`;
        });
      }

      content += `=======================================\n`;

      // Create Blob and Trigger Download
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `vault_summary_${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    function clearAllData() {
      if (confirm("Clear all saved vault and spending history?")) {
        localStorage.removeItem('vaultState');
        state = { vault: 0.00, weekly: 115.00, daily: 16.40, vaultUnlockTime: null, history: [] };
        render();
      }
    }

    setInterval(updateTimer, 1000);
    render();
  </script>
</body>
</html>
